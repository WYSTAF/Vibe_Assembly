[workspace]
resolver = "2"
members = [
    "crates/va-core",
    "crates/va-cli",
    "crates/va-desktop",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Nikan Wystaf <nikan.wystaf@gmail.com>"]
license = "MIT"
repository = "https://github.com/WYSTAF/Vibe_Assembly"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
