[package]
name = "vibe-assembly-control"
version = "1.2.0"
edition = "2021"
description = "Mission Control — a native desktop dashboard for Vibe Assembly .ai/ state"

[lib]
name = "vibe_assembly_control"
path = "src/lib.rs"

[[bin]]
name = "va-control"
path = "src/main.rs"

[dependencies]
# default-features = false drops `wayland` and `x11`, which are Linux-only and
# are the main reason gpui's dependency graph is large enough to overflow the
# Windows compiler stack. Windows needs no features: windowing is Win32 and
# text is DirectWrite.
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
serde_json = "1.0"

[profile.release]
# opt-level 0 keeps codegen stack use low enough that rustc does not abort
# with STATUS_STACK_BUFFER_OVERRUN on Windows (see README).
opt-level = 0
lto = false
codegen-units = 16
